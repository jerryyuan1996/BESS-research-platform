name: CI

# Three ways in, and only two of them can publish:
#
#   push to main    a human push or a merged pull request. Tests, then deploys.
#
#   pull_request    tests only. Never reaches the deploy job.
#
#   workflow_call   the "Live data" workflow (etl.yml) calls this file after it
#                   has pushed a data commit. Tests, then deploys.
#
# The third exists because the first does not cover the bot. etl.yml pushes with
# the default GITHUB_TOKEN, and GitHub deliberately starts no workflow for a push
# made with that token. For seven weeks in 2026 this file assumed otherwise:
# main took a data commit every six hours and production served the snapshot
# from the last human merge. So the ETL now asks for the publish explicitly,
# and it is the same jobs, in the same order, behind the same gates.
#
# What a pull request runs is lighter than what a publish runs, and only in
# one place: the browser checks. A pull request runs the ten-test smoke suite
# against its own build; push and workflow_call run the full suite, as before,
# because those are the runs that deploy. Every other gate — unit and
# governance tests, build, the confidentiality scan, budgets, snapshot
# integrity — runs on every pull request. The full suite for a pull request is
# on request: label it `full-check` and full-check.yml runs it. Decision and
# numbers: docs/ci-performance.md §9.
on:
  push:
    branches: [main]
  # A draft runs nothing (the test job's `if:`); marking it ready for review
  # starts its first run. There is no `labeled` here on purpose: a run started
  # by an unrelated label would post a skipped check over a red one, and the
  # PR would look green. full-check.yml owns the label.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: 'Commit to test and publish — the data commit the caller just pushed'
        required: true
        type: string
    # Declared one by one rather than taken with `secrets: inherit`, so the
    # caller has to name what it hands over and this file states what it needs.
    secrets:
      GUARD_MARKER_SET:
        required: true
      GUARD_FINGERPRINT_KEY:
        required: true
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and governance gates
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A newer push to a pull request cancels that pull request's run in
    # progress: its result would describe a commit nobody will merge.
    #
    # Nothing else is ever cancelled. Every other run gets a group of its own,
    # so on main and in a data publish this block does nothing. Cancelling on
    # main is unsafe because GitHub orders runs by arrival, not by commit: a
    # late run for an older commit would cancel the newer commit's tests. Main
    # skips superseded work a different way — the `check` step below.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}-{1}', github.run_id, inputs.ref || github.sha) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      superseded: ${{ steps.check.outputs.superseded == 'true' || steps.recheck.outputs.superseded == 'true' }}
    # Every gate below runs through scripts/ci/timed.mjs, which appends a label,
    # a duration and an exit code to the runner's temporary directory; the
    # summary step at the end renders it. The path is not set here on purpose:
    # `runner` is not an available context in a job-level `env:`, and setting it
    # that way makes the whole workflow invalid. scripts/ci/timings-file.mjs
    # reads RUNNER_TEMP instead.
    steps:
      # When called from etl.yml, github.sha is the commit the ETL run STARTED
      # on — the one before the data it just pushed. inputs.ref is the data
      # commit itself. On push and pull_request there are no inputs and this
      # falls back to the default.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Test only the newest commit on main. If main has already moved past
      # this candidate, the release script would refuse to publish it, so its
      # gates are skipped here and the deploy job does not start; the newer
      # commit's own run tests and publishes both. Pull requests and runs on
      # other branches are never skipped. Asked again before the browser suite,
      # which is most of the job. Why this and not cancel-in-progress:
      # scripts/ci/superseded.mjs.
      - name: Check this commit is still the head of main
        id: check
        run: node scripts/ci/superseded.mjs
        env:
          CANDIDATE: ${{ inputs.ref || github.sha }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: env.SUPERSEDED != 'true'
        with:
          node-version-file: '.nvmrc'
          # Keyed on package-lock.json. `npm ci` stays as it is: the cache saves
          # the download, not the install, and a lockfile mismatch still fails
          # the step instead of silently resolving a different tree.
          cache: 'npm'

      - run: npm ci
        if: env.SUPERSEDED != 'true'

      # The full suite, including the governance tests that assert the ETL
      # cannot write outside public/data/ and that every comparison field is
      # classified. A pull request that widens automation's authority without
      # saying so fails here.
      #
      # TWO secrets, and both are required wherever REQUIRE_MARKERS is set:
      #
      #   GUARD_MARKER_SET       the confidential marker set, deliberately not in
      #                          the repository — see scripts/lib/markers.mjs
      #   GUARD_FINGERPRINT_KEY  the HMAC key that proves the set was not altered
      #
      # The first pull-request run passed only the marker set and went red on the
      # fingerprint check. That is the mechanism working: it refused to report a
      # set verified when it had no key to verify it with. Keep the two together
      # — a step with REQUIRE_MARKERS and one secret cannot finish what it was
      # asked to do. tests/bundle-confidentiality.test.js asserts the pairing, so
      # the next omission fails locally instead of six minutes into CI.
      #
      # REQUIRE_MARKERS=1 turns "no marker set" from a legitimate local skip into
      # a failure here, for the same reason REQUIRE_OUTPUT exists below: a guard
      # that scans for nothing passes against everything.
      #
      # A fork pull request cannot read secrets and will fail this step. That is
      # the correct direction to fail for a private repository — the alternative
      # is a green run that scanned nothing.
      - name: Test
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/timed.mjs "unit and governance tests" -- npm test
        env:
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
          REQUIRE_MARKERS: '1'

      - name: Build
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/timed.mjs "build" -- npm run build

      # The confidentiality guard asserts on the BUILD OUTPUT, so it is worthless
      # before this point — and it used to run only before this point. `npm test`
      # above still executes tests/bundle-confidentiality.test.js, but with no
      # artefact to scan it skips, which is a pass that proves nothing.
      #
      # This is the PULL-REQUEST gate. It scans dist/, because `vercel build`
      # needs a token no fork pull request has. The authoritative scan — on the
      # bytes actually uploaded — is in the deploy job below, and it scans
      # .vercel/output instead.
      #
      # REQUIRE_OUTPUT=1 turns the "directory is absent" skip into a failure, so
      # the guard cannot go green by scanning nothing. Keep it after Build;
      # moving it earlier silently disarms the last check standing between
      # confidential content and a publish.
      - name: Scan the built bundle for confidential content
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/timed.mjs "confidentiality scan (dist)" -- npm run test:bundle
        env:
          SCAN_DIR: dist
          REQUIRE_OUTPUT: '1'
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
          REQUIRE_MARKERS: '1'

      # Code splitting decays silently: one static import from a market module
      # into the shell pulls that market's whole graph back into the entry chunk,
      # the site still works, and the only symptom is a slower first paint. Runs
      # after Build for the same reason the confidentiality scan does — there is
      # nothing to measure before it.
      - name: Check the bundle budgets
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/timed.mjs "bundle budgets" -- npm run test:budget
        env:
          SCAN_DIR: dist
          REQUIRE_OUTPUT: '1'

      - name: Check again that this commit is still the head of main
        id: recheck
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/superseded.mjs
        env:
          CANDIDATE: ${{ inputs.ref || github.sha }}
          GH_TOKEN: ${{ github.token }}

      # The browser download, cached on the Playwright version. The install
      # command still runs on a hit: it skips the download when the browser is
      # already there, and installs the system libraries, which are not cached.
      - name: Read the Playwright version
        id: playwright
        if: env.SUPERSEDED != 'true'
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the isolated browser
        if: env.SUPERSEDED != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the isolated browser for page checks
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/timed.mjs "install chromium" -- npx playwright install --with-deps --no-shell chromium

      # A pull request runs the smoke suite against its own build, through
      # `vite preview` (playwright.smoke.config.js; PLATFORM_TEST_BASE_URL is
      # not set here, so nothing is fetched from production). Push and
      # workflow_call — the runs that can deploy — run the full suite, so no
      # publish has ever skipped it. For the full suite on a pull request,
      # label it `full-check` (full-check.yml).
      - name: Check the key pages of the built site (pull request)
        if: env.SUPERSEDED != 'true' && github.event_name == 'pull_request'
        run: node scripts/ci/timed.mjs "smoke suite (pull request)" -- npm run test:smoke

      - name: Check desktop, mobile, both languages and saved cases
        if: env.SUPERSEDED != 'true' && github.event_name != 'pull_request'
        run: node scripts/ci/timed.mjs "end-to-end suite" -- npm run test:e2e

      - name: Retain page-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-check-evidence
          path: test-results/
          if-no-files-found: ignore

      # Snapshots are machine-written and carry a checksum over their contents.
      # A hand-edited "observed" file is exactly the confusion the envelope
      # exists to prevent, so it fails the build rather than shipping.
      - name: Verify snapshot integrity
        if: env.SUPERSEDED != 'true'
        run: node scripts/ci/timed.mjs "snapshot integrity" -- npm run etl:verify

      # The raw timings travel to the deploy job, which reports the pre-deploy
      # half of the workflow beside its own. A failed upload must not fail a
      # green test job: the numbers are a report, not a gate.
      - name: Retain the step timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings
          path: ${{ runner.temp }}/ci-timings.tsv
          if-no-files-found: ignore

      - name: Summarise this job
        if: always()
        run: node scripts/ci/summary.mjs --title "CI timings — tests and gates" --artifacts page-check-evidence,ci-timings

  deploy:
    name: Publish the scanned artefact to Vercel
    needs: test
    # Only main deploys, and never from a pull request. Pull requests run every
    # check above and stop there — a fork pull request must never reach the
    # production project or the token that publishes to it.
    #
    # The event is an allowlist, not "anything but pull_request": a trigger
    # added to this file later publishes nothing until it is named here. When
    # etl.yml calls this workflow, github.event_name and github.ref are the
    # CALLER's — schedule or workflow_dispatch, and the branch that run is on —
    # so a "Live data" run dispatched from any other branch is tested and stops.
    #
    # The last clause: a candidate the test job found superseded (main had
    # moved past it) would be refused by the release script anyway, after
    # four minutes of setup and `vercel build`. It is not started. The
    # allowlist above is unchanged, and the release script still checks main
    # inside the lock — this skips work, it decides nothing.
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) &&
      needs.test.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_CLI_VERSION: 48.12.1
    # FIFO is entry order, not commit order. Keep all pending candidates and
    # never let an old late test cancel a newer publisher. The release script
    # checks current main inside this lock, again immediately before promotion.
    concurrency:
      group: vercel-production
      cancel-in-progress: false
      queue: max
    steps:
      # Belt and braces for a repository whose highest-frequency committer is a
      # bot. If the credentials are absent the job stops here with an explanation
      # rather than failing several steps later inside the Vercel CLI, and —
      # more importantly — rather than appearing to have deployed when it did not.
      - name: Confirm the deploy credentials exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "::error::See docs/publishing.md — until they are set, CI publishes nothing."
            exit 1
          fi

      # The same commit the test job checked — see the note there.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Installed into a cached folder keyed on the pinned version, instead of
      # downloaded with `npm install --global` on every deploy. Only main
      # deploys, so only main's runs write this cache; a pull request cannot
      # put a different CLI in front of the production token.
      - name: Restore the Vercel CLI
        id: vercel-cli
        uses: actions/cache@v4
        with:
          path: ~/.vercel-cli
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_CLI_VERSION }}-${{ hashFiles('.nvmrc') }}

      - name: Install the Vercel CLI
        run: |
          if [ "${{ steps.vercel-cli.outputs.cache-hit }}" != "true" ]; then
            npm install --prefix "$HOME/.vercel-cli" --no-audit --no-fund "vercel@$VERCEL_CLI_VERSION"
          fi
          echo "$HOME/.vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$HOME/.vercel-cli/node_modules/.bin/vercel" --version

      # The pre-deploy timings, so the summary can report both halves of the
      # workflow rather than one. A missing artifact — a rerun, a partial
      # upload — leaves the table short, not the job red.
      - name: Collect the test job's timings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-timings
          path: ${{ runner.temp }}/test-job-timings

      # Writes .vercel/project.json and the production environment into the
      # workspace. Nothing here is committed — .vercel is git-ignored.
      - name: Pull the production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Produces .vercel/output — the Build Output API directory that
      # `--prebuilt` uploads verbatim. This is the artefact, not dist/: vercel
      # build runs the Vite build and then copies and adds to its result, so
      # dist/ and .vercel/output are not the same bytes.
      - name: Build the deployment artefact
        run: node scripts/ci/timed.mjs "vercel build" -- vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Stamp the exact source and data vintages
        run: node scripts/stamp-release.mjs
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}

      # THE ARTEFACT THAT IS SCANNED IS THE ARTEFACT THAT SHIPS.
      #
      # This is the load-bearing step in the whole file. It reads the exact
      # directory the next step uploads, in the same workspace, with no rebuild
      # and no artefact round-trip in between — so there is no transformation
      # standing between the check and the thing checked.
      #
      # REQUIRE_OUTPUT=1 means an absent .vercel/output fails instead of
      # skipping. Zero skips is the requirement: a skip here would be a publish
      # nothing looked at.
      - name: Scan .vercel/output for confidential content
        run: node scripts/ci/timed.mjs "confidentiality scan (.vercel/output)" -- npm run test:bundle
        env:
          SCAN_DIR: .vercel/output
          REQUIRE_OUTPUT: '1'
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
          REQUIRE_MARKERS: '1'

      # --prebuilt uploads what was just scanned. Without it the Vercel platform
      # would rebuild from source on its own infrastructure, producing bytes no
      # scan in this workflow has ever seen — which is the exact defect this job
      # is arranged to prevent. Do not remove the flag.
      - name: Deploy
        run: node scripts/ci/timed.mjs "deploy to production" -- node scripts/publish-production.mjs
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
          PRODUCTION_URL: https://globalbess.vercel.app

      - name: Retain the production and rollback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ inputs.ref || github.sha }}
          path: release-records/
          if-no-files-found: ignore

      # THE LIVE CHECK IS A SMOKE CHECK, AND ONLY A SMOKE CHECK.
      #
      # This step used to run the whole Playwright suite again against
      # production: 8.4 minutes of a 9.7-minute publish job, re-asserting 168
      # behaviours that the test job had just asserted against this exact
      # artefact. It found deployment faults, not application ones — and it
      # could not be trusted to say the deploy had worked, because a green run
      # says nothing about whether the domain serves the new bytes.
      #
      # What the live step uniquely proves is narrower: the domain answers, a
      # deep link survives the production rewrite, the market chunks are served,
      # and no uncaught error reaches the console. e2e-smoke/ does that in 1.2–1.8
      # minutes locally, across desktop and mobile — against 8.4 for the suite it
      # replaces. The job summary reports the runner's own figure.
      #
      # The gate that a publish actually happened is above, in the release
      # script: the deployment identity, readiness and `release.json` stamp are
      # checked before promotion, and a superseded candidate records
      # published:false and skips this step.
      # The same browser cache as the test job.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the isolated browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Check the live production pages
        run: |
          if [ -f release-records/production.json ] && node --input-type=module -e "import fs from 'node:fs'; process.exit(JSON.parse(fs.readFileSync('release-records/production.json')).published ? 0 : 1)"; then
            node scripts/ci/timed.mjs "install chromium" -- npx playwright install --with-deps --no-shell chromium
            node scripts/ci/timed.mjs "production smoke" -- npm run test:smoke
          else
            echo 'Superseded candidate did not publish; live checks belong to its successor.'
          fi
        env:
          PLATFORM_TEST_BASE_URL: https://globalbess.vercel.app
          RELEASE_SHA: ${{ inputs.ref || github.sha }}

      - name: Retain live-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-page-check-evidence-${{ inputs.ref || github.sha }}
          path: test-results/
          if-no-files-found: ignore

      - name: Summarise this job
        if: always()
        run: >-
          node scripts/ci/summary.mjs
          --title "CI timings — publish"
          --extra "${{ runner.temp }}/test-job-timings/ci-timings.tsv"
          --artifacts production-release-${{ inputs.ref || github.sha }},live-page-check-evidence-${{ inputs.ref || github.sha }}
