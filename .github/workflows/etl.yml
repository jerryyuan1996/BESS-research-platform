name: Live data

# Eight jobs, and the split is the governance model expressed as CI. The rule
# is: judgement publishes automatically after validation; methodology never
# does.
#
#   refresh   unattended. Fetches, validates, commits observed data and
#             deterministic derived metrics straight to main. Then runs the
#             rules: a trigger the analyst wrote in advance, with a threshold
#             and a change, is tested against what was just fetched, and if it
#             fires the change is written to the view store through the view
#             writer's gate and committed. It can only touch public/data/ and
#             three kinds of file under view/ — enforced in code, and checked
#             again below. Never src/, where methodology lives.
#
#   publish   calls ci.yml on the commit refresh just pushed: the full test
#             job, then the scanned-artefact deploy. Skipped when no data
#             changed. It is here because the push above is made with
#             GITHUB_TOKEN, and GitHub starts no workflow for such a push — a
#             data commit on main does not reach the site unless this job runs.
#
#   propose   opens a pull request when drift is material. Never merges it.
#             Runs on a branch, edits the analyst-controlled value there, and
#             stops. A human decides. Model assumptions still move this way.
#
#   agent     once a month, DRY. Reads the pages that due triggers cite and
#             reports what it would have changed. It has read-only permissions,
#             writes nothing to the repository, and does nothing at all until a
#             model key exists as a repository secret.
#
#   scout     once a month, every region in one run, so every scout card is
#             reviewed monthly. Reads the pages the analyst listed for three
#             markets with no dashboard and writes their cards — once the
#             analyst has made the agent live on scout cards. Until then it is
#             DRY like the agent job: read-only permissions, and the view
#             writer refuses to apply. Live, it may change view/scout/ and the
#             changelog and nothing else: never a core market's view, never
#             the index, never src/. Checked below, then scanned, before the
#             commit.
#
#   publish-scout  calls ci.yml on the commit a scout pass pushed, for the
#             reason publish does.
#
#   digest    once a month. Posts the machine-written changes of the last
#             thirty-one days as an issue, so none goes unseen.
#
#   weekly-briefing  every Monday morning in Perth. Posts the briefing — the
#             call, what changed in the week, what is coming, the shortlist,
#             what to build, the next actions and the analyst's queue — as one
#             issue per week, built by the same model as the home page. No
#             model is asked and no key is needed; it reads and posts, and has
#             no write access to the repository.
#
# Nothing in this file may be given auto-merge. That is deliberate and it is the
# single most important line in the workflow. A rule's change does not need
# one: it is not a pull request. It is a validated write, like the data.

on:
  schedule:
    # Once a day, 06:17 UTC (14:17 in Perth). The sources publish daily, and
    # every connector fetches from the last point it holds, so one run a day
    # misses nothing. It ran every six hours until 7 Nov 2026; four runs a day
    # cost four publishes a day for data that mostly changed once. The
    # freshness badge reads each dataset's refreshHours, which is 24 to match
    # (src/governance/datasets.js, tests/governance.test.js).
    - cron: '17 6 * * *'
    # The agent's dry pass, once a month. No job that asks a model runs more
    # often than monthly: the analyst's ruling of 2026-10-12.
    - cron: '43 5 2 * *'
    # The monthly digest of machine changes.
    - cron: '7 6 3 * *'
    # The scout pass: the 1st of the month, every region in one run. The day is
    # SCOUT_DAY_OF_MONTH in src/governance/scout.js.
    - cron: '23 4 1 * *'
    # The weekly briefing: Sunday 23:07 UTC, which is Monday 07:07 in Perth.
    - cron: '7 23 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated dataset ids (blank = all)'
        required: false
        type: string
      verify_release:
        description: 'Data-only release verification; skip the analyst agent'
        required: false
        type: boolean
        default: false
      weekly_briefing:
        description: 'Post the weekly briefing now instead of a data refresh'
        required: false
        type: boolean
        default: false
      scout_region:
        description: 'Run one scout pass over this region instead of a data refresh'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - nordics-baltics
          - southern-eastern-europe
          - americas-middle-east

concurrency:
  # A long backfill must not race the next scheduled run into the same files.
  group: live-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Fetch, validate, publish
    # Not on the agent's, the digest's or the scout pass's schedule: those run
    # their own job. Nor when a scout pass was asked for by hand.
    if: github.event.schedule != '43 5 2 * *' && github.event.schedule != '7 6 3 * *' && github.event.schedule != '23 4 1 * *' && github.event.schedule != '7 23 * * 0' && inputs.scout_region == '' && inputs.weekly_briefing != true
    runs-on: ubuntu-latest
    # The ETL step records its wall time through scripts/ci/timed.mjs, and the
    # job summary prints it beside the drift report. ETL duration is otherwise
    # only visible by reading etl/out/summary.json out of the artifact. The file
    # path comes from RUNNER_TEMP inside the script — `runner` is not an
    # available context in a job-level `env:`, and using it there invalidates
    # the workflow.
    outputs:
      material: ${{ steps.drift.outputs.material }}
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run ETL
        env:
          # Absent secrets are not an error. The connector skips its dataset and
          # the previous snapshot stays in place — see etl/lib/fetch.mjs.
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          # The repository secret is named FINGRID_API; the connector reads
          # FINGRID_API_KEY. Not passed to the drift job below: no detector reads
          # the reserve series, and the key is rate-limited.
          FINGRID_API_KEY: ${{ secrets.FINGRID_API }}
        # One command. Industry news used to need a second, separate invocation
        # because it was not a catalogue dataset; it is now, so `run.mjs` covers
        # it along with everything else and `--only` can select it by id.
        #
        # Timed, not changed: the same two invocations as before, behind a
        # wrapper that records the duration for the job summary.
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            node scripts/ci/timed.mjs "etl fetch" -- node etl/run.mjs --only "${{ inputs.only }}"
          else
            node scripts/ci/timed.mjs "etl fetch" -- node etl/run.mjs
          fi

      - name: Apply rules
        # After the refresh, in the same job, so a rule tests only what this run
        # fetched and validated (etl/out/summary.json says which). A rule that
        # fires writes view/ through etl/lib/viewWriter.mjs and nothing else. A
        # rejected change leaves a report and writes nothing; the data is still
        # published, and the job fails at its end so somebody looks.
        id: rules
        run: node etl/rules.mjs || echo "rejected=true" >> "$GITHUB_OUTPUT"

      - name: Check the walls held
        # Belt and braces. The two writers make writing anywhere else throw, but
        # a workflow that verifies the invariant after the fact costs nothing and
        # catches a bad merge that weakened it. Two directories, and inside
        # view/ only the three kinds of file the view writer owns: never
        # view/schema/, which says who may write what, and never src/.
        run: |
          OUTSIDE=$(git status --porcelain --untracked-files=all -- . ':!public/data' ':!view/markets' ':!view/index.json' ':!view/changelog.jsonl' ':!etl/out')
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Automation modified files outside public/data/ and the view store:"
            echo "$OUTSIDE"
            exit 1
          fi
          echo "Confirmed: only public/data/ and the view store were modified."

      - name: Scan the view change before it is committed
        id: viewscan
        # The last line of the validation gate: the confidentiality scan passes
        # on the result. A rule writes only what the analyst wrote in advance,
        # so this should never find anything — which is the reason to check. If
        # it fails, or cannot run, the view change is discarded and the job
        # fails after the data is safely published.
        env:
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
        run: |
          if [ -z "$(git status --porcelain -- view)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add view/markets view/index.json view/changelog.jsonl
          if [ -n "$GUARD_MARKER_SET" ] && npm run guard:staged; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The view change did not pass the confidentiality scan and was discarded."
            git reset -q -- view
            git checkout -- view
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "discarded=true" >> "$GITHUB_OUTPUT"
          fi
          git reset -q

      - name: Commit published data
        id: commit
        run: |
          # `git status`, not `git diff`: a dataset's FIRST snapshot is an
          # untracked file, which `git diff` never reports. Using it skipped the
          # first Fingrid snapshots as "nothing changed" on 2026-10-30.
          DATA_CHANGED=$(git status --porcelain --untracked-files=all -- public/data)
          if [ -z "$DATA_CHANGED" ] && [ "${{ steps.viewscan.outputs.changed }}" != "true" ]; then
            echo "Nothing changed this run."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "bess-etl[bot]"
          git config user.email "bess-etl[bot]@users.noreply.github.com"
          if [ "${{ steps.viewscan.outputs.changed }}" = "true" ]; then
            # Its own commit, so `git log view/` reads as the view's history and
            # a rule's change is one revertible unit.
            git add view/markets view/index.json view/changelog.jsonl
            FIRED=$(node -e "const r=require('./etl/out/rules-report.json');console.log(r.reports.filter(x=>x.status==='fired').map(x=>x.rule).join(', '))")
            git commit -m "view: rule ${FIRED} fired" \
                       -m "Written by the rules engine through the view writer's gate. The rule, its threshold and its change were written in advance by the analyst; the changelog line carries the evidence, and the weekly digest gives the command that undoes it."
          fi
          if [ -z "$DATA_CHANGED" ]; then
            bash scripts/ci/push-main.sh
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add public/data
          # The commit message carries the run summary, so `git log public/data`
          # reads as the data's provenance history rather than a wall of
          # identical "update data" lines.
          UPDATED=$(node -e "const s=require('./etl/out/summary.json');console.log(s.updated.join(', ')||'none')")
          git commit -m "data: refresh ${UPDATED}" \
                     -m "Observed data and derived metrics only. No analyst assumption was modified." \
                     -m "$(node -e "const s=require('./etl/out/summary.json');console.log('Failed: '+(s.failed.map(f=>f.id+' ('+f.status+')').join(', ')||'none'))")"
          # Rebases onto main and retries if a merge landed during the run
          # (run 41399142010 failed here with "fetch first"). A conflict fails
          # the job and pushes nothing. See scripts/ci/push-main.sh.
          bash scripts/ci/push-main.sh
          # Written only after the push succeeded, so the publish job can never
          # be handed a commit that is not on the remote. After a rebase HEAD is
          # the rebased commit, which is the one on the remote.
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read drift outcome
        id: drift
        run: |
          MATERIAL=$(node -e "console.log(require('./etl/out/summary.json').material)")
          echo "material=$MATERIAL" >> "$GITHUB_OUTPUT"
          echo "Material findings: $MATERIAL"

      - name: Publish drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            etl/out/drift-report.md
            etl/out/summary.json
            etl/out/proposals.json
            etl/out/rules-report.md
            etl/out/rules-report.json
            etl/out/view-rejected.json
          if-no-files-found: warn

      - name: Reports to the job summary
        run: |
          node scripts/ci/summary.mjs --title "Live data — refresh"
          cat etl/out/drift-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f etl/out/rules-report.md ]; then cat etl/out/rules-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fail if a view change was rejected or discarded
        if: steps.rules.outputs.rejected == 'true' || steps.viewscan.outputs.discarded == 'true'
        run: exit 1

  publish:
    name: Test and publish the data commit
    needs: refresh
    # No data commit, no deploy — a run that changed nothing must not republish
    # what is already live. The ref test repeats the one on ci.yml's deploy job
    # so a run dispatched from another branch does not start the suite at all.
    if: needs.refresh.outputs.committed == 'true' && github.ref == 'refs/heads/main'
    # This workflow holds write permissions for the commit above and the
    # proposal below. Publishing needs neither.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
    secrets:
      GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
      GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  propose:
    name: Open a proposal for material drift
    needs: refresh
    if: needs.refresh.outputs.material != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the data commit the refresh job just pushed, so the proposal is
          # computed against the same snapshots it cites as evidence.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Recompute drift against the published snapshots
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        # --dry-run: this job must not write data. It only needs the findings.
        run: node etl/run.mjs --dry-run

      - name: Apply the proposal on a branch
        run: |
          BRANCH="proposal/drift-$(date -u +%Y%m%d-%H%M)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name  "bess-etl[bot]"
          git config user.email "bess-etl[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          node etl/propose.mjs

      - name: Verify the proposal is structurally valid
        # Registry, governance and finance checks — NOT the legacy baseline.
        #
        # tests/baseline.test.js pins the original prototype's outputs. A
        # proposal that revises an assumption is SUPPOSED to move those numbers,
        # so running it here would fail every legitimate proposal and the whole
        # mechanism would never open a single pull request. That is a real trap
        # and it was hit the first time this workflow was exercised.
        #
        # What must still hold is that the proposed value is a valid market
        # input and that automation stayed inside its authority.
        run: npm run test:structural

      - name: Record the baseline divergence for the reviewer
        # Informational. The baseline is a migration-verification artefact, and
        # departing from it is a decision the reviewer is being asked to make —
        # so it is reported in the pull request rather than hidden in a red X.
        run: |
          echo "" >> etl/out/pr-body.md
          echo "### Legacy baseline" >> etl/out/pr-body.md
          echo "" >> etl/out/pr-body.md
          if npm run test:baseline --silent > /tmp/new-baseline.json 2>/dev/null \
             && ! diff -q /tmp/new-baseline.json tests/fixtures/legacy-baseline.json > /dev/null; then
            echo "This proposal changes outputs pinned by \`tests/fixtures/legacy-baseline.json\`," >> etl/out/pr-body.md
            echo "which records the original prototype's numbers." >> etl/out/pr-body.md
            echo "" >> etl/out/pr-body.md
            echo "That is expected — the fixture verifies the *migration*, not an ongoing" >> etl/out/pr-body.md
            echo "invariant. If you accept this change, regenerate it in the same commit:" >> etl/out/pr-body.md
            echo "" >> etl/out/pr-body.md
            echo '```bash' >> etl/out/pr-body.md
            echo 'npm run test:baseline' >> etl/out/pr-body.md
            echo '```' >> etl/out/pr-body.md
          else
            echo "No change to the pinned legacy baseline." >> etl/out/pr-body.md
          fi

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing was applied — no pull request to open."
            exit 0
          fi
          git add -A ':!etl/out'
          git commit -m "propose: assumption changes from observed drift" \
                     -m "Opened automatically. Requires analyst review — do not auto-merge."
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Proposed assumption changes from observed drift" \
            --body-file etl/out/pr-body.md \
            --label "automated-proposal" \
            --label "needs-analyst-review" \
            --base main \
            --head "$BRANCH"

  agent:
    name: Agent, dry run
    # Once a day, or by hand. It reports and writes nothing: read-only
    # permissions, no commit step, and the view writer refuses an agent's
    # change in any case until the analyst makes the agent a live author.
    if: github.event.schedule == '43 5 2 * *' || (github.event_name == 'workflow_dispatch' && inputs.scout_region == '' && inputs.verify_release != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A repository secret, set by the analyst when he wants the agent to run.
      # Until it exists every step below is skipped and the job is inert.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Nothing to do without a model key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No model key is configured. The agent did not run."

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
        if: env.ANTHROPIC_API_KEY != ''

      - name: Confirm the private folder holds nothing private
        if: env.ANTHROPIC_API_KEY != ''
        # The agent must never see the analyst's private notes. They are
        # git-ignored and cannot be in a fresh checkout; this makes that a
        # checked fact rather than an assumption.
        #
        # Until 2026-10-11 this step failed if the folder existed at all. It
        # always exists — its README is committed — so the step could never
        # pass, and nobody saw that until a model key was added and the job
        # ran for the first time.
        run: |
          # The folder itself is always here: its README is the one file in it
          # that is committed. What must not be here is anything else. The
          # count is reported and never the names, which may themselves be
          # confidential.
          PRIVATE=$(find local-data -mindepth 1 ! -path local-data/README.md 2>/dev/null | wc -l)
          if [ "$PRIVATE" -ne 0 ]; then
            echo "::error::The private folder holds $PRIVATE item(s) besides its README. The agent will not run."
            exit 1
          fi

      - name: Run the agent, dry
        if: env.ANTHROPIC_API_KEY != ''
        run: node agent/run.mjs

      - name: Confirm the agent wrote nothing
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          CHANGED=$(git status --porcelain --untracked-files=all -- . ':!etl/out')
          if [ -n "$CHANGED" ]; then
            echo "::error::The agent modified the repository:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Publish the agent's report
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: |
            etl/out/agent-report.md
            etl/out/agent-report.json
          if-no-files-found: warn

      - name: Report to the job summary
        if: env.ANTHROPIC_API_KEY != ''
        run: cat etl/out/agent-report.md >> "$GITHUB_STEP_SUMMARY"

  scout:
    name: Scout pass
    # Once a month on the 1st, every region in one run, with one pass per
    # region in roster order. Or by hand, one region at a time, with the
    # scout_region input. Dispatching several regions back to back cancels all
    # but the latest queued one: the live-data concurrency group keeps only one
    # pending run.
    #
    # DRY UNTIL THE ANALYST SAYS OTHERWISE, AND THE SWITCH IS NOT IN THIS FILE.
    # Whether the agent's changes to a scout card are applied is
    # SCOUT_LIVE_AUTHORS in view/schema/scout.mjs. While the agent is not in
    # that list the pass prepares, reports and writes nothing, and the steps
    # below that check, scan and commit find nothing to do. `contents: read`
    # is the second lock: making the agent live means changing both, in one
    # pull request the analyst merges.
    if: github.event.schedule == '23 4 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.scout_region != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SCOUT_REGION: ${{ inputs.scout_region }}
    steps:
      - name: Nothing to do without a model key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No model key is configured. The scout pass did not run."

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
        if: env.ANTHROPIC_API_KEY != ''

      - name: Confirm the private folder holds nothing private
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          # The folder itself is always here: its README is the one file in it
          # that is committed. What must not be here is anything else. The
          # count is reported and never the names, which may themselves be
          # confidential.
          PRIVATE=$(find local-data -mindepth 1 ! -path local-data/README.md 2>/dev/null | wc -l)
          if [ "$PRIVATE" -ne 0 ]; then
            echo "::error::The private folder holds $PRIVATE item(s) besides its README. The agent will not run."
            exit 1
          fi

      - name: Run the scout pass
        if: env.ANTHROPIC_API_KEY != ''
        run: node agent/run.mjs --scout

      - name: Confirm only scout cards and the changelog changed
        if: env.ANTHROPIC_API_KEY != ''
        # The wall, checked from outside the program that is held by it. A
        # scout pass may change view/scout/ and append to the changelog. It may
        # not change a core market's view, the index of their verdicts, the
        # schema, or anything outside view/.
        run: |
          OUTSIDE=$(git status --porcelain --untracked-files=all -- . ':!view/scout' ':!view/changelog.jsonl' ':!etl/out')
          if [ -n "$OUTSIDE" ]; then
            echo "::error::The scout pass modified files outside view/scout/ and the changelog:"
            echo "$OUTSIDE"
            exit 1
          fi
          BAD=$(git status --porcelain --untracked-files=all -- view/scout | grep -vE ' view/scout/([a-z][a-z0-9_]*\.json|passes\.jsonl)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::The scout pass left a file in view/scout/ that is not a card or the pass log:"
            echo "$BAD"
            exit 1
          fi
          echo "Confirmed: only scout cards, the pass log and the changelog were modified."

      - name: Scan the cards before they are committed
        id: scan
        if: env.ANTHROPIC_API_KEY != ''
        # The last line of the gate: the confidentiality scan passes on the
        # result. The agent cannot see anything private, so this should never
        # find anything — which is the reason to check. If it fails, or cannot
        # run, the pass is discarded whole.
        env:
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
        run: |
          if [ -z "$(git status --porcelain -- view)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add view/scout view/changelog.jsonl
          if [ -n "$GUARD_MARKER_SET" ] && npm run guard:staged; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The scout pass did not pass the confidentiality scan and was discarded."
            git reset -q -- view
            git checkout -- view
            git clean -fdq -- view/scout
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "discarded=true" >> "$GITHUB_OUTPUT"
          fi
          git reset -q

      - name: Commit the cards
        id: commit
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          if [ "${{ steps.scan.outputs.changed }}" != "true" ]; then
            echo "Nothing to commit: the pass was dry, or it changed nothing."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "bess-etl[bot]"
          git config user.email "bess-etl[bot]@users.noreply.github.com"
          git add view/scout view/changelog.jsonl
          REGION=$(node -e "console.log(require('./etl/out/scout-report.json').region)")
          WRITTEN=$(node -e "console.log(require('./etl/out/scout-report.json').pass.written)")
          git commit -m "view: scout pass ${REGION}, ${WRITTEN} records" \
                     -m "Written by the agent through the view writer's gate, to scout cards only. Every record carries a quotation found in a page fetched in this run; the changelog line holds it, and the weekly digest gives the command that undoes it."
          bash scripts/ci/push-main.sh
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the pass report
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: |
            etl/out/scout-report.md
            etl/out/scout-report.json
          if-no-files-found: warn

      - name: Report to the job summary
        if: env.ANTHROPIC_API_KEY != ''
        run: cat etl/out/scout-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the pass was discarded
        if: steps.scan.outputs.discarded == 'true'
        run: exit 1

  publish-scout:
    name: Test and publish the scout commit
    needs: scout
    if: needs.scout.outputs.committed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.scout.outputs.sha }}
    secrets:
      GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
      GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  digest:
    name: Monthly digest of machine changes
    if: github.event.schedule == '7 6 3 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Render the last thirty-one days
        run: node scripts/view/digest.mjs > digest.md

      - name: Post it, unless the month was empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s digest.md ]; then
            echo "No rule and no agent changed the view this month. Nothing to post."
            exit 0
          fi
          gh label create view-digest --description "Monthly digest of machine changes to the view" --color 5319e7 --force
          gh issue create \
            --title "Machine changes to the view, month to $(date -u +%Y-%m-%d)" \
            --body-file digest.md \
            --label view-digest

  weekly-briefing:
    name: Weekly briefing
    # Monday 07:07 in Perth, or by hand. Deterministic: the same model the home
    # page is built with (src/briefing/), no model asked, no key needed.
    if: github.event.schedule == '7 23 * * 0' || inputs.weekly_briefing == true
    runs-on: ubuntu-latest
    # actions: read is for the minutes line below, and reads run and job
    # records only. Nothing here can start, cancel or change a run.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Render this week's briefing
        run: node scripts/briefing/weekly.mjs > briefing.md

      # Automation minutes for the last 7 and 30 days, summed from job
      # durations (billable minutes read zero while the repository is public).
      # A report, never a gate: if GitHub cannot be read, the briefing posts
      # without the line.
      - name: Add the automation minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/ci/minutes.mjs > minutes.md; then
            echo >> briefing.md
            cat minutes.md >> briefing.md
          else
            echo "::warning::The minutes line could not be read; the briefing posts without it."
          fi

      - name: Post it, one issue a week
        # A second run in the same week edits that week's issue instead of
        # opening another; last week's is closed once this one is posted.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(head -n 1 briefing.md | sed 's/^# //')"
          gh label create weekly-briefing --description "The weekly briefing" --color 0e8a16 --force
          EXISTING=$(gh issue list --label weekly-briefing --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file briefing.md
          else
            gh issue create --title "$TITLE" --body-file briefing.md --label weekly-briefing
          fi
          for n in $(gh issue list --label weekly-briefing --state open --limit 50 --json number,title --jq ".[] | select(.title != \"$TITLE\") | .number"); do
            gh issue close "$n" --comment "Superseded by this week's briefing."
          done
