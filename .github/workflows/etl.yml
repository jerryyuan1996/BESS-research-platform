name: Live data

# Observations are automatic; investment judgement belongs to the analyst.
# refresh may commit public/data only. Rules report possible changes without
# writing view/. Agent and scout are explicit manual report-only jobs.
# No workflow may merge a proposal automatically.

on:
  schedule:
    # Owner-approved unified daily market ETL + policy discovery cycle.
    # Source latency and scheduler drift are additional to this ~24h cadence.
    - cron: '17 6 * * *'
    # The monthly digest of machine changes.
    - cron: '7 6 3 * *'
    # The weekly briefing: Sunday 23:07 UTC, which is Monday 07:07 in Perth.
    - cron: '7 23 * * 0'
  workflow_dispatch:
    inputs:
      run_agent:
        description: 'Start a report-only agent review instead of refreshing data'
        required: false
        type: boolean
        default: false
      only:
        description: 'Comma-separated dataset ids (blank = all)'
        required: false
        type: string
      dry_run:
        description: 'Fetch and report without committing data or publishing'
        required: false
        type: boolean
        default: false
      verify_release:
        description: 'Data-only release verification; skip the analyst agent'
        required: false
        type: boolean
        default: false
      weekly_briefing:
        description: 'Post the weekly briefing now instead of a data refresh'
        required: false
        type: boolean
        default: false
      scout_region:
        description: 'Run one scout pass over this region instead of a data refresh'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - nordics-baltics
          - southern-eastern-europe
          - americas-middle-east

concurrency:
  # A long backfill must not race the next scheduled run into the same files.
  group: live-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-discovery:
    name: Policy discovery, shadow only
    if: github.event.schedule == '17 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.scout_region == '' && inputs.weekly_briefing != true && inputs.run_agent != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore bounded metadata from the latest trusted successful policy job
        run: python scripts/policy/restore-discovery.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Discover reviewed official records without a model
        run: node scripts/policy/discover.mjs
        env:
          POLICY_DISCOVERY_DISABLED: ${{ vars.POLICY_DISCOVERY_DISABLED }}
      - name: Report source coverage separately from workflow success
        run: cat etl/out/policy-discovery.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: policy-discovery
          path: |
            etl/out/policy-discovery.json
            etl/out/policy-discovery.md
            etl/out/policy-discovery-journal.json
          retention-days: 90
          if-no-files-found: error

  # Policy models are local manual-only. No scheduled/dispatch policy model job,
  # model credential, candidate download or automatic policy publication path.

  refresh:
    name: Fetch, validate, publish
    needs: [policy-discovery]
    # Not on the agent's, the digest's or the scout pass's schedule: those run
    # their own job. Nor when a scout pass was asked for by hand.
    if: ${{ !cancelled() && (github.event.schedule == '17 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.scout_region == '' && inputs.weekly_briefing != true && inputs.run_agent != true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The ETL step records its wall time through scripts/ci/timed.mjs, and the
    # job summary prints it beside the drift report. ETL duration is otherwise
    # only visible by reading etl/out/summary.json out of the artifact. The file
    # path comes from RUNNER_TEMP inside the script — `runner` is not an
    # available context in a job-level `env:`, and using it there invalidates
    # the workflow.
    outputs:
      material: ${{ steps.drift.outputs.material }}
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Report independent policy discovery outcome
        # Discovery is shadow-only. Failed/absent policy output never discards
        # validated market data; no policy artifact is copied to public/.
        env:
          POLICY_DISCOVERY_RESULT: ${{ needs.policy-discovery.result }}
        run: echo "Policy discovery outcome=$POLICY_DISCOVERY_RESULT; policy publication disabled." >> "$GITHUB_STEP_SUMMARY"

      - name: Run ETL
        env:
          ETL_ONLY: ${{ inputs.only }}
          ETL_DRY_RUN: ${{ inputs.dry_run }}
          # Absent secrets are not an error. The connector skips its dataset and
          # the previous snapshot stays in place — see etl/lib/fetch.mjs.
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          # The repository secret is named FINGRID_API; the connector reads
          # FINGRID_API_KEY. Not passed to the drift job below: no detector reads
          # the reserve series, and the key is rate-limited.
          FINGRID_API_KEY: ${{ secrets.FINGRID_API }}
        # One command. Industry news used to need a second, separate invocation
        # because it was not a catalogue dataset; it is now, so `run.mjs` covers
        # it along with everything else and `--only` can select it by id.
        #
        # Timed, not changed: the same two invocations as before, behind a
        # wrapper that records the duration for the job summary.
        run: |
          ARGS=()
          if [ -n "$ETL_ONLY" ]; then ARGS+=(--only "$ETL_ONLY"); fi
          if [ "$ETL_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/ci/timed.mjs "etl fetch" -- node etl/run.mjs "${ARGS[@]}"

      - name: Test rules, report only
        id: rules
        if: inputs.dry_run != true
        run: node etl/rules.mjs || echo "rejected=true" >> "$GITHUB_OUTPUT"

      - name: Check the walls held
        # A rule crossing must never alter the approved view or methodology.
        run: |
          OUTSIDE=$(git status --porcelain --untracked-files=all -- . ':!public/data' ':!etl/out')
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Automation modified files outside public/data/:"
            echo "$OUTSIDE"
            exit 1
          fi
          echo "Confirmed: only public/data/ was modified."

      - name: Commit published data
        id: commit
        if: inputs.dry_run != true
        run: |
          # `git status`, not `git diff`: a dataset's FIRST snapshot is an
          # untracked file, which `git diff` never reports. Using it skipped the
          # first Fingrid snapshots as "nothing changed" on 2026-10-30.
          DATA_CHANGED=$(git status --porcelain --untracked-files=all -- public/data)
          if [ -z "$DATA_CHANGED" ]; then
            echo "Nothing changed this run."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "bess-etl[bot]"
          git config user.email "bess-etl[bot]@users.noreply.github.com"
          git add public/data
          # The commit message carries the run summary, so `git log public/data`
          # reads as the data's provenance history rather than a wall of
          # identical "update data" lines.
          UPDATED=$(node -e "const s=require('./etl/out/summary.json');console.log(s.updated.join(', ')||'none')")
          npm run etl:verify
          npm run guard:staged
          git commit -m "data: daily refresh ${UPDATED}" \
                     -m "Validated observed data only; rule reports and policy discovery do not change the approved strategy." \
                     -m "$(node -e "const s=require('./etl/out/summary.json');console.log('Failed: '+(s.failed.map(f=>f.id+' ('+f.status+')').join(', ')||'none'))")"
          # Rebases onto main and retries if a merge landed during the run
          # (run 41399142010 failed here with "fetch first"). A conflict fails
          # the job and pushes nothing. See scripts/ci/push-main.sh.
          bash scripts/ci/push-main.sh
          # Written only after the push succeeded, so the publish job can never
          # be handed a commit that is not on the remote. After a rebase HEAD is
          # the rebased commit, which is the one on the remote.
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
          GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
          REQUIRE_MARKERS: '1'

      - name: Read drift outcome
        id: drift
        run: |
          MATERIAL=$(node -e "console.log(require('./etl/out/summary.json').material)")
          echo "material=$MATERIAL" >> "$GITHUB_OUTPUT"
          echo "Material findings: $MATERIAL"

      - name: Publish drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            etl/out/drift-report.md
            etl/out/summary.json
            etl/out/proposals.json
            etl/out/rules-report.md
            etl/out/rules-report.json
            etl/out/view-rejected.json
          if-no-files-found: warn

      - name: Reports to the job summary
        run: |
          node scripts/ci/summary.mjs --title "Live data — refresh"
          cat etl/out/drift-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f etl/out/rules-report.md ]; then cat etl/out/rules-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fail if a rule proposal was invalid
        if: steps.rules.outputs.rejected == 'true'
        run: exit 1

  publish:
    name: Test and publish the data commit
    needs: refresh
    # No data commit, no deploy — a run that changed nothing must not republish
    # what is already live. The ref test repeats the one on ci.yml's deploy job
    # so a run dispatched from another branch does not start the suite at all.
    # Optional Policy ancestors may be skipped or fail while refresh succeeds.
    # Override implicit success() without allowing failed/cancelled refreshes.
    if: ${{ !cancelled() && needs.refresh.result == 'success' && needs.refresh.outputs.committed == 'true' && github.ref == 'refs/heads/main' }}
    # This workflow holds write permissions for the commit above and the
    # proposal below. Publishing needs neither.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
    secrets:
      GUARD_MARKER_SET: ${{ secrets.GUARD_MARKER_SET }}
      GUARD_FINGERPRINT_KEY: ${{ secrets.GUARD_FINGERPRINT_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  propose:
    name: Open a proposal for material drift
    needs: refresh
    if: needs.refresh.outputs.material != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the data commit the refresh job just pushed, so the proposal is
          # computed against the same snapshots it cites as evidence.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Recompute drift against the published snapshots
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        # --dry-run: this job must not write data. It only needs the findings.
        run: node etl/run.mjs --dry-run

      - name: Apply the proposal on a branch
        run: |
          BRANCH="proposal/drift-$(date -u +%Y%m%d-%H%M)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name  "bess-etl[bot]"
          git config user.email "bess-etl[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          node etl/propose.mjs

      - name: Verify the proposal is structurally valid
        # Registry, governance and finance checks — NOT the legacy baseline.
        #
        # tests/baseline.test.js pins the original prototype's outputs. A
        # proposal that revises an assumption is SUPPOSED to move those numbers,
        # so running it here would fail every legitimate proposal and the whole
        # mechanism would never open a single pull request. That is a real trap
        # and it was hit the first time this workflow was exercised.
        #
        # What must still hold is that the proposed value is a valid market
        # input and that automation stayed inside its authority.
        run: npm run test:structural

      - name: Record the baseline divergence for the reviewer
        # Informational. The baseline is a migration-verification artefact, and
        # departing from it is a decision the reviewer is being asked to make —
        # so it is reported in the pull request rather than hidden in a red X.
        run: |
          echo "" >> etl/out/pr-body.md
          echo "### Legacy baseline" >> etl/out/pr-body.md
          echo "" >> etl/out/pr-body.md
          if npm run test:baseline --silent > /tmp/new-baseline.json 2>/dev/null \
             && ! diff -q /tmp/new-baseline.json tests/fixtures/legacy-baseline.json > /dev/null; then
            echo "This proposal changes outputs pinned by \`tests/fixtures/legacy-baseline.json\`," >> etl/out/pr-body.md
            echo "which records the original prototype's numbers." >> etl/out/pr-body.md
            echo "" >> etl/out/pr-body.md
            echo "That is expected — the fixture verifies the *migration*, not an ongoing" >> etl/out/pr-body.md
            echo "invariant. If you accept this change, regenerate it in the same commit:" >> etl/out/pr-body.md
            echo "" >> etl/out/pr-body.md
            echo '```bash' >> etl/out/pr-body.md
            echo 'npm run test:baseline' >> etl/out/pr-body.md
            echo '```' >> etl/out/pr-body.md
          else
            echo "No change to the pinned legacy baseline." >> etl/out/pr-body.md
          fi

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing was applied — no pull request to open."
            exit 0
          fi
          git add -A ':!etl/out'
          git commit -m "propose: assumption changes from observed drift" \
                     -m "Opened automatically. Requires analyst review — do not auto-merge."
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Proposed assumption changes from observed drift" \
            --body-file etl/out/pr-body.md \
            --label "automated-proposal" \
            --label "needs-analyst-review" \
            --base main \
            --head "$BRANCH"

  agent:
    name: Agent, dry run
    # Explicit manual request only; a data refresh never calls a model.
    if: github.event_name == 'workflow_dispatch' && inputs.run_agent == true && inputs.verify_release != true && inputs.scout_region == '' && inputs.weekly_briefing != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A repository secret, set by the analyst when he wants the agent to run.
      # Until it exists every step below is skipped and the job is inert.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Nothing to do without a model key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No model key is configured. The agent did not run."

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
        if: env.ANTHROPIC_API_KEY != ''

      - name: Confirm the private folder holds nothing private
        if: env.ANTHROPIC_API_KEY != ''
        # The agent must never see the analyst's private notes. They are
        # git-ignored and cannot be in a fresh checkout; this makes that a
        # checked fact rather than an assumption.
        #
        # Until 2026-10-11 this step failed if the folder existed at all. It
        # always exists — its README is committed — so the step could never
        # pass, and nobody saw that until a model key was added and the job
        # ran for the first time.
        run: |
          # The folder itself is always here: its README is the one file in it
          # that is committed. What must not be here is anything else. The
          # count is reported and never the names, which may themselves be
          # confidential.
          PRIVATE=$(find local-data -mindepth 1 ! -path local-data/README.md 2>/dev/null | wc -l)
          if [ "$PRIVATE" -ne 0 ]; then
            echo "::error::The private folder holds $PRIVATE item(s) besides its README. The agent will not run."
            exit 1
          fi

      - name: Run the agent, dry
        if: env.ANTHROPIC_API_KEY != ''
        run: node agent/run.mjs

      - name: Confirm the agent wrote nothing
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          CHANGED=$(git status --porcelain --untracked-files=all -- . ':!etl/out')
          if [ -n "$CHANGED" ]; then
            echo "::error::The agent modified the repository:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Publish the agent's report
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: |
            etl/out/agent-report.md
            etl/out/agent-report.json
          if-no-files-found: warn

      - name: Report to the job summary
        if: env.ANTHROPIC_API_KEY != ''
        run: cat etl/out/agent-report.md >> "$GITHUB_STEP_SUMMARY"

  scout:
    name: Scout pass
    # Explicit regional review only, with no writing or publishing capability.
    if: github.event_name == 'workflow_dispatch' && inputs.scout_region != '' && inputs.verify_release != true && inputs.run_agent != true && inputs.weekly_briefing != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SCOUT_REGION: ${{ inputs.scout_region }}
    steps:
      - name: Nothing to do without a model key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No model key is configured. The scout pass did not run."

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
        if: env.ANTHROPIC_API_KEY != ''

      - name: Confirm the private folder holds nothing private
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          # The folder itself is always here: its README is the one file in it
          # that is committed. What must not be here is anything else. The
          # count is reported and never the names, which may themselves be
          # confidential.
          PRIVATE=$(find local-data -mindepth 1 ! -path local-data/README.md 2>/dev/null | wc -l)
          if [ "$PRIVATE" -ne 0 ]; then
            echo "::error::The private folder holds $PRIVATE item(s) besides its README. The agent will not run."
            exit 1
          fi

      - name: Run the scout pass
        if: env.ANTHROPIC_API_KEY != ''
        run: node agent/run.mjs --scout

      - name: Confirm the scout wrote nothing
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          CHANGED=$(git status --porcelain --untracked-files=all -- . ':!etl/out')
          if [ -n "$CHANGED" ]; then
            echo "::error::The scout modified the repository:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Publish the pass report
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: |
            etl/out/scout-report.md
            etl/out/scout-report.json
          if-no-files-found: warn

      - name: Report to the job summary
        if: env.ANTHROPIC_API_KEY != ''
        run: cat etl/out/scout-report.md >> "$GITHUB_STEP_SUMMARY"

  digest:
    name: Monthly digest of machine changes
    if: github.event.schedule == '7 6 3 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Render the last thirty-one days
        run: node scripts/view/digest.mjs > digest.md

      - name: Post it, unless the month was empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s digest.md ]; then
            echo "No rule and no agent changed the view this month. Nothing to post."
            exit 0
          fi
          gh label create view-digest --description "Monthly digest of machine changes to the view" --color 5319e7 --force
          gh issue create \
            --title "Machine changes to the view, month to $(date -u +%Y-%m-%d)" \
            --body-file digest.md \
            --label view-digest

  weekly-briefing:
    name: Weekly briefing
    # Monday 07:07 in Perth, or by hand. Deterministic: the same model the home
    # page is built with (src/briefing/), no model asked, no key needed.
    if: github.event.schedule == '7 23 * * 0' || inputs.weekly_briefing == true
    runs-on: ubuntu-latest
    # actions: read is for the minutes line below, and reads run and job
    # records only. Nothing here can start, cancel or change a run.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Render this week's briefing
        run: node scripts/briefing/weekly.mjs > briefing.md

      # Automation minutes for the last 7 and 30 days, summed from job
      # durations (billable minutes read zero while the repository is public).
      # A report, never a gate: if GitHub cannot be read, the briefing posts
      # without the line.
      - name: Add the automation minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/ci/minutes.mjs > minutes.md; then
            echo >> briefing.md
            cat minutes.md >> briefing.md
          else
            echo "::warning::The minutes line could not be read; the briefing posts without it."
          fi

      - name: Post it, one issue a week
        # A second run in the same week edits that week's issue instead of
        # opening another; last week's is closed once this one is posted.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(head -n 1 briefing.md | sed 's/^# //')"
          gh label create weekly-briefing --description "The weekly briefing" --color 0e8a16 --force
          EXISTING=$(gh issue list --label weekly-briefing --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file briefing.md
          else
            gh issue create --title "$TITLE" --body-file briefing.md --label weekly-briefing
          fi
          for n in $(gh issue list --label weekly-briefing --state open --limit 50 --json number,title --jq ".[] | select(.title != \"$TITLE\") | .number"); do
            gh issue close "$n" --comment "Superseded by this week's briefing."
          done
